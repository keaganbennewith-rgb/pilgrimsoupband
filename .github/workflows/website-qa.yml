name: Website QA

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - run: |
          npx http-server . -p 4173 -c-1 &
          SERVER_PID=$!
          sleep 3
          npm run test:links
          npm run test:a11y
          npm run test:lighthouse
          kill $SERVER_PID
